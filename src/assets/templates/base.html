<!DOCTYPE html>
<html lang="{{ lang | default('ja') }}" data-view="{{ default_view | default('book') }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if page_title %}{{ page_title }} | {% endif %}{{ site_title }}</title>
    <script>
      try {
        const savedView = localStorage.getItem('wiki-view-mode');
        if (savedView === 'classic' || savedView === 'book') {
          document.documentElement.setAttribute('data-view', savedView);
        } else if (window.innerWidth < 768) {
          document.documentElement.setAttribute('data-view', 'classic');
        }
        const savedTheme = localStorage.getItem('tmtbook-theme');
        if (savedTheme === 'dark' || savedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
        // Decide the panes' collapsed state before the first paint. book.js
        // applies the real classes on DOMContentLoaded and clears these, but
        // by then the panes would already have been painted open.
        const narrow = window.innerWidth <= 900;
        const collapsed = (key) => {
          const saved = localStorage.getItem(key);
          return saved !== null ? saved === 'true' : narrow;
        };
        if (collapsed('wiki-pane-nav-collapsed')) {
          document.documentElement.setAttribute('data-nav-collapsed', 'true');
        }
        if (collapsed('wiki-pane-data-collapsed')) {
          document.documentElement.setAttribute('data-data-collapsed', 'true');
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/book.css?v={{ css_version }}" />
    {% for css in custom_css %}
    <link rel="stylesheet" href="{{ css }}" />
    {% endfor %}
  </head>
  <body class="is-fluid">
    <div class="container is-fluid">
      <div class="floating-controls" id="floating-controls" data-pagefind-ignore>
        <div class="floating-drag-handle" id="floating-drag-handle" title="{{ t["drag.handle"] }}" aria-label="{{ t["drag.handle"] }}">
          <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor" aria-hidden="true">
            <circle cx="2.5" cy="2" r="1.5" />
            <circle cx="7.5" cy="2" r="1.5" />
            <circle cx="2.5" cy="7" r="1.5" />
            <circle cx="7.5" cy="7" r="1.5" />
            <circle cx="2.5" cy="12" r="1.5" />
            <circle cx="7.5" cy="12" r="1.5" />
          </svg>
        </div>
        <div class="search-container">
          <div class="search-input-wrapper">
            <input
              type="search"
              id="wiki-search-input"
              placeholder="{{ t["search.placeholder"] }}"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div id="wiki-search-results" class="search-results" hidden></div>
        </div>
        <div class="view-switcher" role="group" aria-label="{{ t["view.switch"] }}">
          <button type="button" class="view-btn view-btn-book" id="btn-view-book" title="{{ t["view.book_title"] }}">{{ t["view.book"] }}</button>
          <button type="button" class="view-btn view-btn-classic" id="btn-view-classic" title="{{ t["view.classic_title"] }}">{{ t["view.classic"] }}</button>
        </div>
      </div>

      {% block content %}{% endblock %}
    </div>

    <!-- Hover Page Preview -->
    <div id="wiki-page-preview" class="wiki-preview-card" hidden data-pagefind-ignore>
      <div class="preview-header">
        <span class="preview-title"></span>
        <span class="preview-section"></span>
      </div>
      <div class="preview-content">
        <div class="preview-body"></div>
        <img class="preview-thumb" src="" alt="" hidden />
      </div>
    </div>

    <!-- Sticky Tabs Subheadings Hover Popover -->
    <div id="sticky-hover-popover" class="sticky-hover-popover" hidden data-pagefind-ignore>
      <div class="sticky-hover-popover-header">
        <span class="sticky-hover-popover-title"></span>
      </div>
      <div class="sticky-hover-popover-list"></div>
    </div>

    <!-- Image Lightbox Modal -->
    <div id="wiki-image-lightbox" class="lightbox-overlay" hidden data-pagefind-ignore>
      <div class="lightbox-dialog">
        <button type="button" class="lightbox-close" aria-label="{{ t["lightbox.close"] }}">✕</button>
        <div class="lightbox-img-wrapper">
          <img id="lightbox-img" src="" alt="" />
        </div>
        <div class="lightbox-caption" id="lightbox-caption"></div>
      </div>
    </div>

    <script>window.tmtStrings = {{ t | tojson | safe }};</script>
    <script src="/book.js?v={{ js_version }}"></script>
  </body>
</html>
